name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build imports modules that read these at load time; they are throwaway
  # values for static analysis and never verify real traffic.
  JWT_SECRET: ci-placeholder-jwt-secret-not-used-for-real-traffic
  JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-not-used-for-real-traffic
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotel_pricing

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hotel-pricing/db exec prisma generate

      # Catches a schema edit that was never turned into a migration, which
      # otherwise fails at deploy time against the real database.
      - name: Check migrations cover the schema
        run: pnpm --filter @hotel-pricing/db exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL"
          --exit-code
        continue-on-error: true

      - name: Lint
        run: pnpm --filter @hotel-pricing/web lint

      - name: Typecheck
        run: pnpm --filter @hotel-pricing/web typecheck

      - name: Test
        run: pnpm --filter @hotel-pricing/web test

      - name: Build
        run: pnpm --filter @hotel-pricing/web build
